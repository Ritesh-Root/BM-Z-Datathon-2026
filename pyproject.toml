[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitalwatch"
version = "0.1.0"
description = "VitalWatch: real-time AI for critical care decisions on IBM LinuxONE (IBM Z Datathon 2026, SSF2026)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
nnpa = ["snapml>=1.17"]

[tool.setuptools.packages.find]
include = ["vitalwatch*"]

[tool.setuptools.package-data]
vitalwatch = ["web/templates/*", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
